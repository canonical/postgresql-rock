project: postgres-rock

backends:
  craft:
    type: craft
    systems:
      - ubuntu-26.04

suites:
  spread/tests/:
    summary: General integration tests

    prepare: |
      # For 'rockcraft.skopeo'
      snap install rockcraft --classic --edge
      snap install docker

      # Wait for docker daemon to come online
      apt install -y retry
      retry --times=10 --delay 2 -- docker run hello-world

      # Load the rock into docker
      rockcraft.skopeo --insecure-policy copy "oci-archive:$CRAFT_ARTIFACT" docker-daemon:postgres:spreadtest

      # Install postgresql client (psql)
      apt install -y postgresql-client
    prepare-each: |
      echo '9pPS9xqlRFdO3ZCStqsjf5Z5' > postgres_password.txt
      chown 584792:584792 postgres_password.txt
      chmod 400 postgres_password.txt
      docker run -d --rm -p 5432:5432 --mount type=bind,source="$PWD/postgres_password.txt",destination=/run/secrets/postgres_password,readonly --name "${SPREAD_TASK//\//_}" postgres:spreadtest
      sleep 5 # Wait for pebble to bootstrap and launch Postgres
      docker exec "${SPREAD_TASK//\//_}" sh -c 'echo "host all all all scram-sha-256" >> "$PGDATA/pg_hba.conf"'
      docker restart "${SPREAD_TASK//\//_}"
      sleep 3
    restore-each: |
      docker kill "${SPREAD_TASK//\//_}" || true
    restore: |
      docker image rm --force postgres:spreadtest

exclude:
  - .git

kill-timeout: 1h
